name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Build, test, and package
        shell: pwsh
        run: ./eng/build.ps1 -Version 0.1.0

      - name: Smoke-test MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem ./artifacts/package -Recurse -Filter '*-en-US.msi' | Select-Object -First 1
          if ($null -eq $msi) { throw 'English MSI was not produced.' }
          ./eng/smoke-installer.ps1 -MsiPath $msi.FullName

      - uses: actions/upload-artifact@v7
        with:
          name: DB-Backup-Remote-Sync
          path: |
            artifacts/package/**/*.msi
            artifacts/package/**/*.sha256
          if-no-files-found: error
